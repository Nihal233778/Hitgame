<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Adsonar · Hen & Egg · Right Scoreboard</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
            background: linear-gradient(145deg, #fef3da 0%, #fbe9c3 100%);
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        /* main container uses flex row for right-side scoreboard */
        .game-layout {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: stretch;
        }

        /* left side: hen & actions area */
        .farm-area {
            flex: 2;
            min-width: 260px;
            background: rgba(255, 248, 235, 0.9);
            border-radius: 64px;
            padding: 24px 20px 32px;
            backdrop-filter: blur(2px);
            box-shadow: 0 20px 35px rgba(80, 50, 20, 0.15);
            border: 1px solid #ffdeae;
        }

        /* right side: vertical scoreboard */
        .scoreboard-right {
            flex: 1;
            min-width: 150px;
            background: #fff3e2;
            border-radius: 56px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
            border: 1px solid #ffd9a5;
        }

        .score-card-vertical {
            text-align: center;
            background: #fae9cf;
            border-radius: 48px;
            padding: 18px 8px;
            transition: all 0.1s;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02), 0 6px 0 #dfc294;
        }
        .score-label-v {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 2px;
            color: #b5722e;
        }
        .score-value-v {
            font-size: 2.6rem;
            font-weight: 800;
            line-height: 1;
            margin-top: 8px;
            background: linear-gradient(135deg, #f7a81e, #e06e1a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .highscore-v {
            background: linear-gradient(125deg, #ffd58c, #ffbc66);
        }
        .highscore-v .score-value-v {
            background: linear-gradient(135deg, #2d2418, #5a3e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* hen character */
        .hen-center {
            display: flex;
            justify-content: center;
            margin: 20px 0 18px;
        }
        .hen-btn {
            background: radial-gradient(circle at 35% 35%, #ffcd82, #e6963a);
            width: 200px;
            height: 200px;
            border-radius: 50% 50% 45% 45%;
            cursor: pointer;
            transition: transform 0.08s linear;
            box-shadow: 0 16px 20px rgba(0,0,0,0.2), inset 0 -3px 0 rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffefc0;
        }
        .hen-btn:active {
            transform: scale(0.94);
        }
        .hen-btn.disabled {
            filter: grayscale(0.3);
            opacity: 0.6;
            pointer-events: none;
        }
        .hen-emoji {
            font-size: 5.2rem;
            filter: drop-shadow(2px 8px 10px rgba(0,0,0,0.15));
        }
        .tap-hint {
            background: #2e241a;
            padding: 5px 16px;
            border-radius: 50px;
            color: #ffdd99;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .basket-message {
            text-align: center;
            background: #f5e2c1;
            padding: 10px 18px;
            border-radius: 60px;
            font-weight: 600;
            color: #9b5e2c;
            margin: 12px 0 20px;
            font-size: 0.85rem;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            border: none;
            font-weight: 700;
            padding: 12px 0;
            border-radius: 60px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(105deg, #ffa53e, #ff7e1e);
            color: white;
            box-shadow: 0 4px 0 #b45a1a;
        }
        .btn-secondary {
            background: #eedbbc;
            color: #6f441e;
            box-shadow: 0 4px 0 #c9a16b;
        }
        .btn-primary:active, .btn-secondary:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b45a1a;
        }

        /* review panel (hidden initially) */
        .review-panel {
            margin-top: 24px;
            background: #fff7ed;
            border-radius: 48px;
            padding: 22px 18px;
            border: 1px solid #ffcf8a;
        }
        .review-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            color: #bd702a;
        }
        .star-rating {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 14px 0;
        }
        .star {
            font-size: 2rem;
            cursor: pointer;
            color: #ddc29b;
            transition: transform 0.1s;
        }
        .star.active {
            color: #ffbc3c;
            text-shadow: 0 0 6px #ffa826;
        }
        .review-textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 32px;
            background: #fff1e0;
            border: 1px solid #ffcf8a;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 14px;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(95deg, #72a56e, #548c4a);
            color: white;
            box-shadow: 0 3px 0 #36612e;
            border: none;
        }
        .feedback-msg {
            text-align: center;
            font-size: 0.75rem;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }

        /* floating egg animation */
        .fly-egg {
            position: fixed;
            pointer-events: none;
            font-size: 2rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            animation: eggFloat 0.65s ease-out forwards;
            z-index: 1000;
        }
        @keyframes eggFloat {
            0% { opacity: 1; transform: translateY(0) scale(0.7) rotate(0deg); }
            60% { opacity: 1; transform: translateY(-55px) scale(1.1) rotate(12deg); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.3) rotate(18deg); }
        }

        .shake-hen {
            animation: shakeAnim 0.15s ease-in-out 2;
        }
        @keyframes shakeAnim {
            0% { transform: translateX(0); }
            25% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 560px) {
            .game-layout {
                flex-direction: column;
            }
            .scoreboard-right {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 12px;
            }
            .score-card-vertical {
                flex: 1;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
<div class="game-layout">
    <!-- LEFT: Farm area (hen + actions) -->
    <div class="farm-area">
        <div class="hen-center">
            <div class="hen-btn" id="henButton">
                <div class="hen-emoji">🐔</div>
                <div class="tap-hint">TAP · EGG</div>
            </div>
        </div>
        <div id="basketMessage" class="basket-message">🥚 Tap the hen to collect eggs!</div>
        <div class="action-buttons">
            <button class="btn btn-primary" id="startGameBtn">🌾 START</button>
            <button class="btn btn-secondary" id="resetGameBtn">🔄 RESET</button>
        </div>
        <div class="action-buttons hidden" id="playAgainContainer">
            <button class="btn btn-primary" id="playAgainBtn">🐣 PLAY AGAIN</button>
        </div>
        <!-- review panel appears after game ends -->
        <div id="reviewPanel" class="review-panel hidden">
            <div class="review-title">📝 Rate Adsonar</div>
            <div class="star-rating" id="starWidget">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <textarea class="review-textarea" id="reviewComment" rows="2" placeholder="Share your feedback about Adsonar..."></textarea>
            <button class="btn submit-btn" id="submitReviewBtn">✍️ SUBMIT REVIEW</button>
            <div class="feedback-msg" id="reviewFeedback"></div>
            <div class="feedback-msg" id="finalScoreInfo"></div>
        </div>
    </div>

    <!-- RIGHT: Scoreboard vertical -->
    <div class="scoreboard-right">
        <div class="score-card-vertical">
            <div class="score-label-v">🥚 EGGS</div>
            <div class="score-value-v" id="scoreDisplay">0</div>
        </div>
        <div class="score-card-vertical">
            <div class="score-label-v">⚡ COMBO</div>
            <div class="score-value-v" id="comboDisplay">0</div>
        </div>
        <div class="score-card-vertical">
            <div class="score-label-v">⏱️ TIME</div>
            <div class="score-value-v" id="timeDisplay">30</div>
        </div>
        <div class="score-card-vertical highscore-v">
            <div class="score-label-v">🏆 BEST</div>
            <div class="score-value-v" id="highScoreDisplay">0</div>
        </div>
    </div>
</div>

<script>
    // ---------- TELEGRAM WEB APP INIT ----------
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();
    document.body.style.backgroundColor = "#fef3da";

    // DOM elements
    const henBtn = document.getElementById('henButton');
    const scoreSpan = document.getElementById('scoreDisplay');
    const comboSpan = document.getElementById('comboDisplay');
    const timeSpan = document.getElementById('timeDisplay');
    const highScoreSpan = document.getElementById('highScoreDisplay');
    const basketMsg = document.getElementById('basketMessage');
    const startBtn = document.getElementById('startGameBtn');
    const resetBtn = document.getElementById('resetGameBtn');
    const playAgainContainer = document.getElementById('playAgainContainer');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const reviewPanel = document.getElementById('reviewPanel');
    const starWidget = document.getElementById('starWidget');
    const reviewComment = document.getElementById('reviewComment');
    const submitReviewBtn = document.getElementById('submitReviewBtn');
    const reviewFeedback = document.getElementById('reviewFeedback');
    const finalScoreInfo = document.getElementById('finalScoreInfo');

    // Game state
    let gameActive = false;
    let currentScore = 0;
    let currentCombo = 0;
    let timeLeft = 30;
    let highScore = 0;
    let timerInterval = null;
    let comboTimer = null;
    let reviewSubmitted = false;
    let selectedRating = 0;

    // Load highscore from localStorage
    try {
        const saved = localStorage.getItem('adsonarEggRightHigh');
        if (saved && !isNaN(parseInt(saved))) highScore = parseInt(saved);
        highScoreSpan.innerText = highScore;
    } catch(e) {}

    // Telegram user info (optional)
    if (tg.initDataUnsafe?.user) {
        const firstName = tg.initDataUnsafe.user.first_name || 'Farmer';
        // not displayed but could be used, no need to show extra
    }

    // Helper: update UI on scoreboard
    function updateUI() {
        scoreSpan.innerText = currentScore;
        comboSpan.innerText = currentCombo;
        timeSpan.innerText = timeLeft;
        if (currentCombo >= 5) comboSpan.style.textShadow = "0 0 6px #ffb347";
        else comboSpan.style.textShadow = "none";
        if (timeLeft <= 5) timeSpan.style.color = "#e67e22";
        else timeSpan.style.color = "";
    }

    // Combo reset timer (2 seconds without tapping)
    function resetComboTimer() {
        if (comboTimer) clearTimeout(comboTimer);
        comboTimer = setTimeout(() => {
            if (gameActive && currentCombo !== 0) {
                currentCombo = 0;
                updateUI();
                tg.HapticFeedback?.impactOccurred('soft');
                basketMsg.innerText = "🌀 Combo lost! Tap again to build streak.";
                setTimeout(() => {
                    if (gameActive) basketMsg.innerText = "🧺 Tap the hen for eggs!";
                }, 1300);
            }
        }, 2000);
    }

    // Floating egg effect
    function createFloatingEgg(x, y) {
        const egg = document.createElement('div');
        egg.className = 'fly-egg';
        egg.innerHTML = '🥚';
        egg.style.left = `${x - 20}px`;
        egg.style.top = `${y - 25}px`;
        document.body.appendChild(egg);
        setTimeout(() => egg.remove(), 700);
    }

    // Hen shake effect
    function shakeHen() {
        henBtn.classList.add('shake-hen');
        setTimeout(() => henBtn.classList.remove('shake-hen'), 250);
    }

    // Core action: hen lays egg
    function layEgg(event) {
        if (!gameActive) return;

        // increment
        currentScore++;
        currentCombo++;
        updateUI();

        // high score update
        if (currentScore > highScore) {
            highScore = currentScore;
            highScoreSpan.innerText = highScore;
            localStorage.setItem('adsonarEggRightHigh', highScore);
            tg.HapticFeedback?.impactOccurred('light');
        }

        resetComboTimer();
        tg.HapticFeedback?.impactOccurred('medium');
        shakeHen();

        // get coordinates for egg animation
        let clientX, clientY;
        if (event.touches) {
            clientX = event.touches[0].clientX;
            clientY = event.touches[0].clientY;
        } else {
            clientX = event.clientX;
            clientY = event.clientY;
        }
        if (clientX && clientY) createFloatingEgg(clientX, clientY);
        else createFloatingEgg(window.innerWidth/2, window.innerHeight/2 - 50);

        // update basket message for combo fun
        if (currentCombo === 3) basketMsg.innerText = "🔥 EGGSTRA! +3 streak!";
        else if (currentCombo === 7) basketMsg.innerText = "⭐ SUPER HEN! Keep going!";
        else basketMsg.innerText = `🥚 +1 egg! Total: ${currentScore}`;
        setTimeout(() => {
            if (gameActive && basketMsg) basketMsg.innerText = "🧺 Tap the hen for more eggs!";
        }, 1000);
    }

    // Timer
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (gameActive && timeLeft > 0) {
                timeLeft--;
                updateUI();
                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            } else if (!gameActive) {
                clearInterval(timerInterval);
            }
        }, 1000);
    }

    // End game
    function endGame() {
        if (!gameActive) return;
        gameActive = false;
        if (timerInterval) clearInterval(timerInterval);
        if (comboTimer) clearTimeout(comboTimer);
        henBtn.classList.add('disabled');
        basketMsg.innerText = `⏰ Time's up! You collected ${currentScore} eggs.`;

        // Show review panel and play again button
        startBtn.style.display = 'none';
        playAgainContainer.classList.remove('hidden');
        reviewPanel.classList.remove('hidden');
        finalScoreInfo.innerText = `🎉 Final score: ${currentScore} eggs! Share your review.`;

        // reset review submission state
        reviewSubmitted = false;
        selectedRating = 0;
        highlightStars(0);
        reviewComment.value = '';
        reviewFeedback.innerText = '';
        submitReviewBtn.disabled = false;
        submitReviewBtn.style.opacity = '1';
        document.querySelectorAll('.star').forEach(star => star.style.pointerEvents = 'auto');
        reviewComment.disabled = false;
        tg.HapticFeedback?.notificationOccurred('warning');
    }

    // Start new game
    function startNewGame() {
        if (timerInterval) clearInterval(timerInterval);
        if (comboTimer) clearTimeout(comboTimer);
        gameActive = true;
        currentScore = 0;
        currentCombo = 0;
        timeLeft = 30;
        updateUI();
        henBtn.classList.remove('disabled');
        basketMsg.innerText = "🐔 Tap the hen! Each tap = one egg!";
        startBtn.style.display = 'none';
        playAgainContainer.classList.add('hidden');
        reviewPanel.classList.add('hidden');
        startTimer();
        tg.HapticFeedback?.impactOccurred('heavy');
    }

    // Full reset (idle state)
    function fullReset() {
        if (timerInterval) clearInterval(timerInterval);
        if (comboTimer) clearTimeout(comboTimer);
        gameActive = false;
        currentScore = 0;
        currentCombo = 0;
        timeLeft = 30;
        updateUI();
        henBtn.classList.add('disabled');
        basketMsg.innerText = "🌾 Press START to begin farming";
        startBtn.style.display = 'block';
        playAgainContainer.classList.add('hidden');
        reviewPanel.classList.add('hidden');
        // reset review flags
        reviewSubmitted = false;
        selectedRating = 0;
        highlightStars(0);
        reviewComment.value = '';
        reviewFeedback.innerText = '';
        submitReviewBtn.disabled = false;
        submitReviewBtn.style.opacity = '1';
        finalScoreInfo.innerText = '';
        document.querySelectorAll('.star').forEach(star => star.style.pointerEvents = 'auto');
        reviewComment.disabled = false;
    }

    // Star rating logic
    function highlightStars(rating) {
        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            const val = parseInt(star.getAttribute('data-value'));
            if (val <= rating) star.classList.add('active');
            else star.classList.remove('active');
        });
    }

    function starClickHandler(e) {
        if (reviewSubmitted) {
            reviewFeedback.innerText = "✨ Review already sent! Start a new game to rate again.";
            return;
        }
        const val = parseInt(e.currentTarget.getAttribute('data-value'));
        selectedRating = val;
        highlightStars(val);
        tg.HapticFeedback?.selectionChanged();
    }

    function bindStars() {
        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            star.removeEventListener('click', starClickHandler);
            star.addEventListener('click', starClickHandler);
        });
    }

    // Submit review via Telegram
    function submitReview() {
        if (reviewSubmitted) {
            reviewFeedback.innerText = "You already reviewed Adsonar this round. Thank you!";
            return;
        }
        if (selectedRating === 0) {
            reviewFeedback.innerText = "⭐ Please select a star rating before submitting!";
            tg.HapticFeedback?.notificationOccurred('error');
            return;
        }
        const comment = reviewComment.value.trim();
        const payload = {
            action: "adsonar_hen_right_scoreboard",
            rating: selectedRating,
            comment: comment || "No comment provided",
            game_score: currentScore,
            game_mode: "Hen Lays Egg (Right Scoreboard)",
            timestamp: Date.now(),
            user_id: tg.initDataUnsafe?.user?.id || "anonymous"
        };
        tg.sendData(JSON.stringify(payload));
        reviewFeedback.innerHTML = `✅ Thank you! ${selectedRating}⭐ submitted to Adsonar.`;
        reviewSubmitted = true;
        submitReviewBtn.disabled = true;
        submitReviewBtn.style.opacity = '0.6';
        document.querySelectorAll('.star').forEach(star => star.style.pointerEvents = 'none');
        reviewComment.disabled = true;
        tg.HapticFeedback?.notificationOccurred('success');
    }

    // Event listeners
    henBtn.addEventListener('click', layEgg);
    henBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        layEgg(e);
    });

    startBtn.addEventListener('click', () => {
        fullReset();
        startNewGame();
    });
    resetBtn.addEventListener('click', () => {
        fullReset();
        tg.HapticFeedback?.impactOccurred('light');
    });
    playAgainBtn.addEventListener('click', () => {
        fullReset();
        startNewGame();
        tg.HapticFeedback?.impactOccurred('medium');
    });
    submitReviewBtn.addEventListener('click', submitReview);

    // initial state
    fullReset();
    bindStars();
    console.log("Adsonar Hen Game — Right scoreboard pattern active");
</script>
</body>
</html>
